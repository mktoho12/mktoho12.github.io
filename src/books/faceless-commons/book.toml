title = "顔の見えない共有地"
kicker = "AIとOSSの、これから"
subtitle = "AIの時代に、OSSが廃れたら社会はどう変わるか"
meta = "2026年11月21日 校了 ・ 約16,000字 ・ 序章と5つの章と終章"
date = "2026-11-21"
description = "AIがコードを書く時代に、OSSの文化が廃れたら社会はどう変わるか。作ったものの届き方、知識の置き場所、支える人の負担、安全、お金の5つから考える、約1万6千字の本です。"
colophon = "著者との対話をもとに、一般的な書籍の制作工程のうち、内容に関わる部分をなぞってつくりました。考えの持ち主は著者で、それ以外の役割はAIが分担しています。おすすめ案がある場面では、著者の判断を待たずに進めました。"
process = [["企画", "編集者", "企画書と目次案をつくる"], ["企画会議", "別エージェント", "営業と読者の立場から検討する"], ["執筆", "ブックライター", "構成案に沿って初稿を書く"], ["編集", "編集者", "初稿を読んで直す"], ["校閲", "校閲者", "事実を調べ、出典を付ける"], ["初校", "校正者", "表記をそろえ、文を整える"], ["再校", "校正者", "差し替えた部分を確かめる"], ["著者校正", "代行", "著者の発言の記録と照らし合わせる"], ["校了", "編集者", "すべての指摘を反映して完成"]]

